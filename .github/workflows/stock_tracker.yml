name: PS5 Pro Stock Tracker

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email"
        required: true
        default: true
        type: boolean

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run PS5 stock tracker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_MODE: ${{ inputs.test_email || 'false' }}
        run: |
          echo "Starting PS5 stock tracker..."
          echo "TEST_MODE=$TEST_MODE"
          python ps5_stock_tracker.py
